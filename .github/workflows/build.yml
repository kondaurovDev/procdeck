name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # The Effect language service is patched into tsc by the root `prepare`
      # script, so this also reports Effect diagnostics.
      - name: Typecheck
        run: pnpm check:types

      - name: Test
        run: pnpm test
