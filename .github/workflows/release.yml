name: Release

# A version tag releases: v2.0.0, or v2.0.0-rc.1 for a pre-release — a GitHub
# pre-release, and npm packages under the `next` dist-tag instead of `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the history for the changelog.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ensure lsof
        run: command -v lsof || sudo apt-get install -y lsof

      - name: Test
        run: go test -race ./...

      # Embedded into every binary GoReleaser builds.
      - name: Build the UI
        run: pnpm --filter @procdeck/ui build

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask to kondaurovDev/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The tag that triggered this run, not whichever tag `git describe`
          # picks when several sit on the same commit (v2.0.0-rc.1 and v2.0.0).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # No npm token: every package trusts this workflow (npm trusted
      # publishing over OIDC, hence `id-token: write` above), and provenance
      # comes with it. The platform packages first, then the launcher that
      # depends on them.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          for dir in $(node npm/build.mjs "$version" dist); do
            npm publish "$dir" --access public --tag "$tag" --provenance
          done
