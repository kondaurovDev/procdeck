packages:
  - packages/*
  - example

# Don't try to re-sync node_modules before every script run — it aborts in
# non-interactive shells (no TTY) and slows local runs.
verifyDepsBeforeRun: false

allowBuilds:
  # The PTY bindings need no entry here: @lydell/node-pty ships its binaries as
  # per-platform packages, so there is no install script to approve.
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.37.0"
  - "@effect/tsgo-darwin-x64@0.37.0"
  - "@effect/tsgo-linux-arm64@0.37.0"
  - "@effect/tsgo-linux-arm@0.37.0"
  - "@effect/tsgo-linux-x64@0.37.0"
  - "@effect/tsgo-win32-arm64@0.37.0"
  - "@effect/tsgo-win32-x64@0.37.0"
  - "@effect/tsgo@0.37.0"
