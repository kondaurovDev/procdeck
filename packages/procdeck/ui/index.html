<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>procdeck</title>
    <meta name="theme-color" content="#151a21" />
    <!-- Paint the stored theme before the first frame (no light/dark flash).
         Reads the same localStorage record as ui/src/storage.ts; the app takes
         over from here (ApplyTheme), including the theme-color meta. -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("procdeck.ui") || "{}").theme
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme
        var dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (!dark) document.querySelector('meta[name="theme-color"]').content = "#f6f8fa"
      } catch (_) {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Installable web app: the manifest is generated by the server so it
         carries the deck's name (see src/server.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="procdeck" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
