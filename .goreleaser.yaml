# Release builds: `git tag v2.0.0 && git push --tags` runs .github/workflows/
# release.yml, which builds the UI first (it is embedded) and then this.
# A pre-release tag (v2.0.0-rc.1) makes a GitHub pre-release; the npm
# packages go out under the `next` dist-tag then.
version: 2
project_name: procdeck

before:
  hooks:
    # Shell completions ship in the archives; the Homebrew cask installs them.
    - sh -c 'mkdir -p completions && for shell in bash zsh fish; do go run . completion $shell > completions/procdeck.$shell; done'

builds:
  - id: procdeck
    main: .
    binary: procdeck
    env:
      # Pure Go: static on Linux, no libc to match.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/kondaurovDev/procdeck/internal/version.Version={{ .Version }}

# Signs the darwin binaries with the Developer ID Application certificate
# and notarizes them with Apple — from Linux, no Mac in CI (GoReleaser's
# built-in quill). Runs between build and archive, so the tarballs, the cask
# and the npm packages all carry the signed binary. Skipped when the secrets
# are not set: a release without them still goes out, unsigned.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [procdeck]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Fail the release on a rejected submission instead of shipping it.
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [license, readme.md, completions/*]

checksum:
  name_template: checksums.txt

# `brew install kondaurovDev/tap/procdeck`: a cask (Homebrew's packaging for
# prebuilt binaries) in the tap repository, rewritten on every stable release.
# Needs HOMEBREW_TAP_TOKEN — a token that can push to that repository.
homebrew_casks:
  - name: procdeck
    repository:
      owner: kondaurovDev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/kondaurovDev/procdeck
    description: Dev-process multiplexer with a web UI
    # A pre-release tag makes a GitHub pre-release only; the tap stays on the
    # last stable version.
    skip_upload: auto
    binaries: [procdeck]
    completions:
      bash: completions/procdeck.bash
      zsh: completions/procdeck.zsh
      fish: completions/procdeck.fish

# .deb and .rpm on the GitHub release, next to the tarballs.
nfpms:
  - package_name: procdeck
    vendor: Aleksandr Kondaurov
    maintainer: Aleksandr Kondaurov <kondaurov.dev@gmail.com>
    homepage: https://github.com/kondaurovDev/procdeck
    description: Dev-process multiplexer with a web UI
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    # Port discovery shells out to it.
    dependencies: [lsof]

changelog:
  use: github
  sort: asc

release:
  prerelease: auto
